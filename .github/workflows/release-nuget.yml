name: Release NuGet

# タグ v1.2.3 を push すると SharpHdl.Core / Emit を pack して nuget.org へ公開する。
# nuget.org の Trusted Publishing（OIDC）を使う。長期 API キーは不要。
# ポリシーの Workflow File は release-nuget.yml、Repository は yukari6559/CsharpHdl。

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  pack-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Tag must look like v1.2.3 (got: $TAG)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Test
        run: dotnet test CsharpHdl.slnx -c Release --verbosity normal

      - name: Pack
        run: |
          mkdir -p artifacts/nuget
          dotnet pack src/SharpHdl.Core/SharpHdl.Core.csproj -c Release -o artifacts/nuget -p:Version=${{ steps.ver.outputs.version }} -p:PackageVersion=${{ steps.ver.outputs.version }}
          dotnet pack src/SharpHdl.Emit/SharpHdl.Emit.csproj -c Release -o artifacts/nuget -p:Version=${{ steps.ver.outputs.version }} -p:PackageVersion=${{ steps.ver.outputs.version }}
          ls -la artifacts/nuget

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org のプロフィール名（メールではない）
          user: araiguma

      - name: Push to nuget.org
        run: |
          dotnet nuget push artifacts/nuget/SharpHdl.Core.*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
          dotnet nuget push artifacts/nuget/SharpHdl.Emit.*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
