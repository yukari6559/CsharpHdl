name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore CsharpHdl.slnx
      - name: Build
        run: dotnet build CsharpHdl.slnx --no-restore -c Release
      - name: Test
        run: dotnet test CsharpHdl.slnx --no-build -c Release --verbosity normal
