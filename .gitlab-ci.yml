# Build, test, security scans and Verilog lint on merge requests, main, tags and schedules.
# main: dev packages (X.Y.Z+1-dev.N) to the GitLab NuGet registry and the requirements report.
# A tag vX.Y.Z publishes SharpHdl.Core / Emit / Sim to nuget.org via Trusted Publishing
# (GitLab OIDC id_token exchanged for a one-hour API key; no long-lived secret),
# then creates a GitLab Release with notes generated from commit subjects.
# nuget.org policy: namespace "sharphdl", project "SharpHDL", environment "release".

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  # A newer pipeline on the same ref cancels this one (publishing jobs opt out).
  interruptible: true

variables:
  # Security templates only run in branch pipelines unless this is set; the workflow
  # above replaces branch pipelines with MR pipelines while an MR is open.
  AST_ENABLE_MR_PIPELINES: "true"
  # Ultimate: cross-function taint analysis for C#; Semgrep keeps the rules it does not cover.
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  # Restored from the cache below instead of downloading every package on each job.
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

.nuget-cache: &nuget-cache
  key:
    files:
      - src/SharpHdl.Tests/packages.lock.json
      - Directory.Build.props
  paths:
    - .nuget/packages

# Merge request pipelines run a job only when its inputs changed; main, tags and schedules run everything.
.code-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
        - tools/**/*
        - templates/**/*
        - examples/**/*
        - CsharpHdl.slnx
        - Directory.Build.props
        - .editorconfig
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

stages:
  - test
  - report
  - publish
  - release

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  # This project's own CI/CD component (templates/verilog-lint.yml), at the same commit.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/verilog-lint@$CI_COMMIT_SHA
    inputs:
      emit_command: dotnet run --project tools/VerilogSamples -c Release -- artifacts/verilog
      # Non-blocking until #119 (hierarchical output glues endmodule to the next module) is fixed.
      allow_failure: true
  # The examples: each one must build against the current API; files are named <example>-<Module>.v.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/verilog-lint@$CI_COMMIT_SHA
    inputs:
      job_name: examples-lint
      emit_command: tools/emit-examples.sh artifacts/examples
      verilog_dir: artifacts/examples
      verilator_flags: -Wall -Wno-DECLFILENAME
      # alu-top is hierarchical (#119).
      allow_failure: true

build-test:
  stage: test
  cache: *nuget-cache
  rules: !reference [.code-rules, rules]
  script:
    - dotnet restore CsharpHdl.slnx --locked-mode
    - dotnet build CsharpHdl.slnx --no-restore -c Release
    - >
      dotnet test CsharpHdl.slnx --no-build -c Release --verbosity normal
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/artifacts/test/{assembly}.junit.xml"
      --collect:"XPlat Code Coverage" --results-directory "$CI_PROJECT_DIR/artifacts/coverage"
    - |
      COBERTURA=$(find artifacts/coverage -name coverage.cobertura.xml | sed -n 1p)
      grep -o '<coverage [^>]*line-rate="[0-9.]*"' "$COBERTURA" | sed -n 1p \
        | sed 's/.*line-rate="\([0-9.]*\)"/\1/' | awk '{printf "Line coverage: %.2f%%\n", $1 * 100}'
  coverage: '/Line coverage: \d+(?:\.\d+)?%/'
  artifacts:
    when: always
    expire_in: 30 days
    # Report files are not passed to later jobs; the requirements job reads the JUnit files.
    paths:
      - artifacts/test/
    reports:
      junit: artifacts/test/*.junit.xml
      coverage_report:
        coverage_format: cobertura
        path: artifacts/coverage/**/coverage.cobertura.xml

code-quality:
  stage: test
  needs: []
  cache: *nuget-cache
  rules: !reference [.code-rules, rules]
  script:
    - mkdir -p artifacts/sarif
    - dotnet restore CsharpHdl.slnx --locked-mode
    # Warnings stay warnings here so the report can list them; build-test fails on them (CI=true).
    - >
      dotnet build CsharpHdl.slnx --no-restore -c Release -p:TreatWarningsAsErrors=false
      -p:SarifOutputDir="$CI_PROJECT_DIR/artifacts/sarif"
    - >
      dotnet run --project tools/SarifToCodeQuality -c Release --no-build --
      "$CI_PROJECT_DIR" gl-code-quality-report.json artifacts/sarif/*.sarif
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gl-code-quality-report.json
    reports:
      codequality: gl-code-quality-report.json

verilog-lint:
  cache: *nuget-cache
  rules: !reference [.code-rules, rules]

examples-lint:
  cache: *nuget-cache
  rules: !reference [.code-rules, rules]

renovate-config:
  stage: test
  needs: []
  image:
    name: renovate/renovate:44
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - renovate.json
  script:
    # Without a file argument the repository config is validated (a path is read as global config).
    - renovate-config-validator --strict

renovate:
  stage: test
  needs: []
  image:
    name: renovate/renovate:44
    entrypoint: [""]
  # Runs in scheduled pipelines (weekly; play the schedule to run it on demand). Pipeline variables
  # are disabled for this project, so the job keys off the pipeline source instead of a variable.
  # RENOVATE_TOKEN is a masked, protected CI variable (project access token, Developer).
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_ONBOARDING: "false"
    # Installs dotnet on demand so packages.lock.json files are updated with the packages.
    RENOVATE_BINARY_SOURCE: install
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/.renovate
    # Auto-merge is enabled right after the MR is created, once its pipeline runs. Renovate checks
    # 5 times, waiting delay × attempt² ms (default 250 ms, about 14 s in total); merged results
    # pipelines take longer to start, so wait about 55 s.
    RENOVATE_X_GITLAB_MERGE_REQUEST_DELAY: "1000"
    LOG_LEVEL: info
  cache:
    key: renovate
    paths:
      - .renovate/cache
  script:
    - renovate

requirements:
  stage: report
  needs:
    - job: build-test
      artifacts: true
    - job: verilog-lint
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - tools/requirements-report.sh .gitlab/requirements.tsv requirements.json artifacts/test/*.junit.xml artifacts/verilog/verilog-lint.junit.xml
  artifacts:
    reports:
      requirements: requirements.json

.docfx:
  cache: *nuget-cache
  variables:
    DOCFX_VERSION: "2.81.0"
  script:
    - dotnet tool install -g docfx --version "$DOCFX_VERSION"
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet restore CsharpHdl.slnx --locked-mode
    # Broken links and API metadata problems fail the job.
    - docfx docs-site/docfx.json --warningsAsErrors

pages-preview:
  extends: .docfx
  stage: test
  needs: []
  # The API reference is generated from the XML docs in src/.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/**/*
        - docs-site/**/*
        - src/**/*
        - Directory.Build.props
        - .gitlab-ci.yml
  # Pages parallel deployment per MR; deleted when the MR is merged or closed.
  pages:
    path_prefix: "mr-$CI_MERGE_REQUEST_IID"
    expire_in: 1 week
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    url: https://sharphdl.gitlab.io/SharpHDL/mr-$CI_MERGE_REQUEST_IID
  artifacts:
    paths:
      - public

pages:
  extends: .docfx
  stage: publish
  interruptible: false
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  pages: true
  artifacts:
    paths:
      - public

publish-dev-package:
  stage: publish
  interruptible: false
  needs: [build-test]
  cache: *nuget-cache
  # Only when the packaged projects change; CI- or docs-only merges would publish the same content.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes:
        - src/SharpHdl.Core/**/*
        - src/SharpHdl.Emit/**/*
        - src/SharpHdl.Sim/**/*
        - Directory.Build.props
  script:
    - BASE=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/SharpHdl.Core/SharpHdl.Core.csproj | sed -n 1p)
    - VERSION="$(echo "$BASE" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')-dev.$CI_PIPELINE_IID"
    - echo "Publishing $VERSION to the GitLab package registry"
    - mkdir -p artifacts/nuget
    - |
      for p in Core Emit Sim; do
        dotnet pack "src/SharpHdl.$p/SharpHdl.$p.csproj" -c Release -o artifacts/nuget \
          -p:Version="$VERSION" -p:PackageVersion="$VERSION"
      done
    - >
      dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json"
      --name gitlab --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text
    - |
      for p in Core Emit Sim; do
        dotnet nuget push "artifacts/nuget/SharpHdl.$p.$VERSION.nupkg" --source gitlab
      done

publish-nuget:
  stage: publish
  interruptible: false
  needs: [build-test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-].+)?$/
  environment:
    name: release
  id_tokens:
    NUGET_ID_TOKEN:
      aud: "https://www.nuget.org"
  variables:
    NUGET_USERNAME: araiguma
    # Release notes need every commit since the previous tag.
    GIT_DEPTH: 0
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - tools/release-notes.sh "$CI_COMMIT_TAG" > release-notes.md
    - mkdir -p artifacts/nuget
    - |
      for p in Core Emit Sim; do
        dotnet pack "src/SharpHdl.$p/SharpHdl.$p.csproj" -c Release -o artifacts/nuget \
          -p:Version="$VERSION" -p:PackageVersion="$VERSION"
      done
    - ls -la artifacts/nuget
    # The temporary key is valid for one hour, so request it right before pushing.
    - |
      RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST https://www.nuget.org/api/v2/token \
        -H 'Content-Type: application/json' \
        -H "Authorization: Bearer $NUGET_ID_TOKEN" \
        -d "{\"username\": \"$NUGET_USERNAME\", \"tokenType\": \"ApiKey\"}")
      STATUS=$(echo "$RESPONSE" | tail -n 1)
      if [ "$STATUS" != "200" ]; then
        echo "NuGet token exchange failed (HTTP $STATUS)"
        exit 1
      fi
      API_KEY=$(echo "$RESPONSE" | head -n -1 | sed -n 's/.*"apiKey"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
      if [ -z "$API_KEY" ]; then
        echo "NuGet token response did not contain an apiKey"
        exit 1
      fi
      for p in Core Emit Sim; do
        dotnet nuget push "artifacts/nuget/SharpHdl.$p.$VERSION.nupkg" \
          --source https://api.nuget.org/v3/index.json --api-key "$API_KEY" --skip-duplicate
      done
  artifacts:
    paths:
      - release-notes.md

release:
  stage: release
  interruptible: false
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: publish-nuget
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-].+)?$/
  script:
    - cat release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "SharpHdl $CI_COMMIT_TAG"
    description: ./release-notes.md
