# Build, test, security scans and Verilog lint on merge requests, main, tags and schedules.
# main: dev packages (X.Y.Z+1-dev.N) to the GitLab NuGet registry and the requirements report.
# A tag vX.Y.Z publishes SharpHdl.Core / Emit / Sim to nuget.org via Trusted Publishing
# (GitLab OIDC id_token exchanged for a one-hour API key; no long-lived secret),
# then creates a GitLab Release with notes generated from commit subjects.
# nuget.org policy: namespace "sharphdl", project "SharpHDL", environment "release".

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0

variables:
  # Security templates only run in branch pipelines unless this is set; the workflow
  # above replaces branch pipelines with MR pipelines while an MR is open.
  AST_ENABLE_MR_PIPELINES: "true"
  # Ultimate: cross-function taint analysis for C#; Semgrep keeps the rules it does not cover.
  GITLAB_ADVANCED_SAST_ENABLED: "true"

stages:
  - test
  - report
  - publish
  - release

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml

build-test:
  stage: test
  script:
    - dotnet restore CsharpHdl.slnx --locked-mode
    - dotnet build CsharpHdl.slnx --no-restore -c Release
    - >
      dotnet test CsharpHdl.slnx --no-build -c Release --verbosity normal
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/artifacts/test/{assembly}.junit.xml"
      --collect:"XPlat Code Coverage" --results-directory "$CI_PROJECT_DIR/artifacts/coverage"
    - |
      COBERTURA=$(find artifacts/coverage -name coverage.cobertura.xml | sed -n 1p)
      grep -o '<coverage [^>]*line-rate="[0-9.]*"' "$COBERTURA" | sed -n 1p \
        | sed 's/.*line-rate="\([0-9.]*\)"/\1/' | awk '{printf "Line coverage: %.2f%%\n", $1 * 100}'
  coverage: '/Line coverage: \d+(?:\.\d+)?%/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: artifacts/test/*.junit.xml
      coverage_report:
        coverage_format: cobertura
        path: artifacts/coverage/**/coverage.cobertura.xml

verilog-lint:
  stage: test
  needs: []
  # Non-blocking until #119 (hierarchical output glues endmodule to the next module) is fixed.
  allow_failure: true
  script:
    - apt-get update -qq && apt-get install -y -qq verilator iverilog > /dev/null
    # sed reads all input; head would close the pipe early and fail the job with SIGPIPE under pipefail.
    - verilator --version && iverilog -V 2>&1 | sed -n 1p
    - dotnet run --project tools/VerilogSamples -c Release -- artifacts/verilog
    - tools/lint-verilog.sh artifacts/verilog artifacts/verilog-lint.junit.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/verilog/
    reports:
      junit: artifacts/verilog-lint.junit.xml

requirements:
  stage: report
  needs:
    - job: build-test
      artifacts: true
    - job: verilog-lint
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - tools/requirements-report.sh .gitlab/requirements.tsv requirements.json artifacts/test/*.junit.xml artifacts/verilog-lint.junit.xml
  artifacts:
    reports:
      requirements: requirements.json

publish-dev-package:
  stage: publish
  needs: [build-test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - BASE=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/SharpHdl.Core/SharpHdl.Core.csproj | sed -n 1p)
    - VERSION="$(echo "$BASE" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')-dev.$CI_PIPELINE_IID"
    - echo "Publishing $VERSION to the GitLab package registry"
    - mkdir -p artifacts/nuget
    - |
      for p in Core Emit Sim; do
        dotnet pack "src/SharpHdl.$p/SharpHdl.$p.csproj" -c Release -o artifacts/nuget \
          -p:Version="$VERSION" -p:PackageVersion="$VERSION"
      done
    - >
      dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json"
      --name gitlab --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text
    - |
      for p in Core Emit Sim; do
        dotnet nuget push "artifacts/nuget/SharpHdl.$p.$VERSION.nupkg" --source gitlab
      done

publish-nuget:
  stage: publish
  needs: [build-test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-].+)?$/
  environment:
    name: release
  id_tokens:
    NUGET_ID_TOKEN:
      aud: "https://www.nuget.org"
  variables:
    NUGET_USERNAME: araiguma
    # Release notes need every commit since the previous tag.
    GIT_DEPTH: 0
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - tools/release-notes.sh "$CI_COMMIT_TAG" > release-notes.md
    - mkdir -p artifacts/nuget
    - |
      for p in Core Emit Sim; do
        dotnet pack "src/SharpHdl.$p/SharpHdl.$p.csproj" -c Release -o artifacts/nuget \
          -p:Version="$VERSION" -p:PackageVersion="$VERSION"
      done
    - ls -la artifacts/nuget
    # The temporary key is valid for one hour, so request it right before pushing.
    - |
      RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST https://www.nuget.org/api/v2/token \
        -H 'Content-Type: application/json' \
        -H "Authorization: Bearer $NUGET_ID_TOKEN" \
        -d "{\"username\": \"$NUGET_USERNAME\", \"tokenType\": \"ApiKey\"}")
      STATUS=$(echo "$RESPONSE" | tail -n 1)
      if [ "$STATUS" != "200" ]; then
        echo "NuGet token exchange failed (HTTP $STATUS)"
        exit 1
      fi
      API_KEY=$(echo "$RESPONSE" | head -n -1 | sed -n 's/.*"apiKey"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
      if [ -z "$API_KEY" ]; then
        echo "NuGet token response did not contain an apiKey"
        exit 1
      fi
      for p in Core Emit Sim; do
        dotnet nuget push "artifacts/nuget/SharpHdl.$p.$VERSION.nupkg" \
          --source https://api.nuget.org/v3/index.json --api-key "$API_KEY" --skip-duplicate
      done
  artifacts:
    paths:
      - release-notes.md

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: publish-nuget
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-].+)?$/
  script:
    - cat release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "SharpHdl $CI_COMMIT_TAG"
    description: ./release-notes.md
